# Публикация макета на GitHub Pages: собирает один HTML-файл и выкладывает его как index.html.
# 2026-11-09: включено по решению владельца — онлайн-показ заказчику (витрина + админка).
# Pages-сайт открыт всем, у кого есть ссылка; индексация запрещена (noindex + robots.txt).
# Запуск — вручную (Actions → Pages → Run workflow) или пушем в main.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Собрать папку сайта
        run: |
          mkdir -p site
          cp release/*.html site/
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
