# Публикация макета на GitHub Pages: собирает один HTML-файл и выкладывает его как index.html.
# ВЫКЛЮЧЕНО по решению заказчика (2026-11-09): никакой публичности до подтверждения прав (RIGHTS-001).
# Pages-сайт открыт всем по ссылке даже у закрытого репозитория. Запуск — только вручную и только
# после письменного согласия партнёра; тогда же включить Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
      - run: mkdir -p site && cp release/cskaticket-demo.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
